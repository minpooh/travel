        <div th:replace="modal_location :: locationModal"></div>
        <th:block th:replace="~{layout/footer :: footerFragment}"></th:block>
        <th:block th:replace="~{common/script :: scriptFragment}"></th:block>
        <script>
            //header
            $('.header').addClass('text-white-header');
            $(window).scroll(function(){
                var scroll = $(window).scrollTop();
                if(scroll > 80) {
                    $('.header').removeClass('text-white-header');
                    $('.header').addClass('white-header');
                }else{
                    $('.header').removeClass('white-header');
                    $('.header').addClass('text-white-header');
                }
            });

            //modal
            for (let i = 1; i <= 12; i++) {
                let location = document.getElementById(`location${i}`);
                location.addEventListener('shown.bs.modal', function () {});
            }


            //modal location copy
            function copy() {
                var text = document.getElementById("spot1location");

                navigator.clipboard.writeText(text.innerText) // 또는 text.textContent 사용 가능
                alert("복사되었습니다.");
            }

            //category action
            $(document).on('click', '.cate-action', function(){
                var target = $(this).data('target');
                $('.cate-action').removeClass('active');
                $(this).addClass('active');
                if(target == 'domestic'){
                    $('.cate-action-target').hide();
                    $('.cate-action-target[data-target="domestic"]').show();
                }else if(target == 'foreign'){
                    $('.cate-action-target').hide();
                    $('.cate-action-target[data-target="foreign"]').show();
                } else {
                    $('.cate-action-target').show();
                }
            });
        </script>
